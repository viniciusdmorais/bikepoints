<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BikePoints Race</title>

    <script src="assets/js/script.js" defer></script>

    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <div class="wind"></div>
    <div class="wind wind2"></div>
    <div class="wind wind3"></div>

    <div class="container">

        <h1 id="dayOfWeek"></h1>

        <h2>🏁 BIKEPOINTS RACE</h2>

        <div class="password-box">
            <input type="password" id="adminPassword" placeholder="Senha admin">
            <button id="unlockBtn">Desbloquear</button>
        </div>

        <div class="race-track">

            <div class="track-lines"></div>

            <div id="racer1" class="racer top"></div>
            <div id="racer2" class="racer bottom"></div>

            <div class="finish-line"></div>

        </div>

        <div class="score-display">
            <div class="player-card">
                <h3>🔥 Brabo</h3>
                <span id="score1Text">0 / 30</span>
            </div>

            <div class="player-card">
                <h3>⚡ Gabriel</h3>
                <span id="score2Text">0 / 30</span>
            </div>
        </div>

        <div class="scores locked" id="controls">

            <input type="number" id="score1Input" min="0" max="30" value="0">
            <button id="addPoints1">+ Pontos Brabo</button>

            <input type="number" id="score2Input" min="0" max="30" value="0">
            <button id="addPoints2">+ Pontos Gabriel</button>

            <button id="saveScores">Salvar</button>

        </div>

        <div id="winnerBanner" class="winner-banner hidden"></div>

    </div>

</body>
</html>
